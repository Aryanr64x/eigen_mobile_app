name: eigen_flutter
description: "Gamifiy Learning"
publish_to: 'none'
version: 0.1.0+16

environment:
  sdk: ^3.11.5

dependencies:
  dio: ^5.9.2
  flutter:
    sdk: flutter
  flutter_launcher_icons: ^0.14.4
  flutter_native_splash: ^2.4.7
  flutter_riverpod: ^3.3.1
  shared_preferences: ^2.5.5
  supabase_flutter: ^2.12.4
  webview_flutter: ^4.13.1
  web: ^1.0.0

dev_dependencies:
  flutter_test:
    sdk: flutter
  flutter_lints: ^6.0.0

flutter:
  uses-material-design: true
  assets:
    - assets/images/

flutter_icons:
  android: true
  ios: true
  image_path: "assets/images/logo.png"


flutter_native_splash:
  color: "#ffffff"
  image: assets/images/logo.png

  android_12:
    image: assets/images/logo.png
    color: "#ffffff"
    